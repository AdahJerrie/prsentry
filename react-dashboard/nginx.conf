server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy dashboard API calls to the Go backend container
    location /api/ {
        proxy_pass http://go-service:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://go-service:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client-side routing fallback (/prs/:id, /stats)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
